name: Build V41.11 direct-link candidate
on:
  push:
    branches: [offline-interview-v41-11-direct-link]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-11-direct-link
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply V41.11 patch
        run: python .github/v41_11_direct_link.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/audio-window.js && node --check offline-interview/direct-interview-link.js
      - name: Direct-link contract
        run: node offline-interview/test-direct-interview-link.mjs
      - name: Semantic boundary regression
        run: node offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Parse V41.11 questionnaire
        run: node -e "JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v41-11.json','utf8')); console.log('PASS questionnaire')"
      - name: Verify fail-closed invariants
        run: |
          ! grep -q "recoverBoundaryTurnsWithSystem" offline-interview/app.js
          ! grep -q "boundary-recovery" offline-interview/app.js
          ! grep -q "recorder.stop().*selectSpeaker" offline-interview/app.js
      - name: Commit exact candidate
        run: |
          rm .github/v41_11_direct_link.py .github/workflows/v41-11-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build V41.11 direct interview link candidate"
          git push
