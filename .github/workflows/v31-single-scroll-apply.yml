name: Apply Offline Interview V31 single scroll shell

on:
  push:
    branches:
      - offline-interview-v31-single-scroll-shell
    paths:
      - offline-interview/v31-single-scroll-apply.py
      - .github/workflows/v31-single-scroll-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v31-single-scroll-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V31 runtime patch
        run: python offline-interview/v31-single-scroll-apply.py
      - name: Validate JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Keep capture regressions visible
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V31 structural invariants
        run: |
          grep -q "2026-09-04.interview-runtime-v31" offline-interview/app.js
          grep -q 'interview-workspace-scroll' offline-interview/index.html
          grep -q 'grid-template-rows:minmax(0,1fr) auto' offline-interview/styles.css
          grep -q 'capture-dock{position:static!important' offline-interview/styles.css
          grep -q 'app.js?v=31' offline-interview/index.html
          grep -q "offline-interview-v31" offline-interview/sw.js
          grep -q 'ON AIR' offline-interview/app.js
      - name: Commit V31 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Use one scroll owner with a structural capture footer'
            git push origin HEAD:offline-interview-v31-single-scroll-shell
          fi
