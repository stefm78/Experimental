name: Apply Offline Interview V33 question frame

on:
  push:
    branches: [offline-interview-v33-question-frame]
    paths:
      - 'offline-interview/v33-question-frame-apply.py'
      - '.github/workflows/v33-question-frame-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v33-question-frame
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V33 runtime patch
        run: python offline-interview/v33-question-frame-apply.py
      - name: Validate JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/sw.js
      - name: Preserve capture regressions
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V33 invariants
        run: |
          grep -q "2026-09-04.interview-runtime-v33" offline-interview/app.js
          grep -q 'styles.css?v=33' offline-interview/index.html
          grep -q 'app.js?v=33' offline-interview/index.html
          grep -q "offline-interview-v33" offline-interview/sw.js
          grep -q 'stable question frame + conversation-only scroll' offline-interview/styles.css
      - name: Commit V33 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js
          git commit -m 'Keep question fixed while conversation scrolls'
          git push origin HEAD:offline-interview-v33-question-frame
