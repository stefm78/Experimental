name: Repair V39 single completion finalization

on:
  push:
    branches: [offline-interview-v39-completion-state]
    paths:
      - '.github/workflows/v39-single-finalize-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v39-completion-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded repair
        run: python offline-interview/v39-single-finalize-repair.py
      - name: Parse and regress
        run: |
          node --check offline-interview/app.js
          node offline-interview/test-completion-path-v39.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Commit bounded repair
        run: |
          git config user.name "Stef"
          git config user.email "104558808+stefm78@users.noreply.github.com"
          git add offline-interview/app.js offline-interview/test-completion-path-v39.mjs
          git commit -m "Prevent duplicate V39 completion finalization"
          git push origin HEAD:offline-interview-v39-completion-state
