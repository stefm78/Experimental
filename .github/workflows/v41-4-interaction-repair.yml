name: Repair V41.4
on:
  push:
    branches: [offline-interview-v41-4-interaction-repair]
    paths:
      - '.github/workflows/v41-4-interaction-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Repair V41.4 interaction fail-open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-4-interaction-repair
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python .github/v41_4_patch.py
      - name: Validate
        run: |
          node --check offline-interview/app.js
          node offline-interview/test-system-stt-boundary.mjs
          node offline-interview/test-system-stt-hard-cut.mjs
          node offline-interview/test-runtime-contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v41-4.json','utf8'))"
      - name: Commit repair
        run: |
          rm .github/workflows/v41-4-interaction-repair.yml .github/v41_4_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair V41.4 interaction fail-open'
          git push origin HEAD:offline-interview-v41-4-interaction-repair
