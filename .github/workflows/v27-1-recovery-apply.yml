name: Apply Offline Interview V27.1 recovery

on:
  push:
    branches:
      - offline-interview-v27-1-runtime-recovery
    paths:
      - offline-interview/v27-1-recovery-apply.py
      - .github/workflows/v27-1-recovery-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v27-1-runtime-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply recovery patch
        run: python offline-interview/v27-1-recovery-apply.py
      - name: Validate JavaScript syntax
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Verify recovery invariants
        run: |
          grep -q "interview-runtime-v27-1" offline-interview/app.js
          grep -q "app.js?v=27-1" offline-interview/index.html
          grep -q "offline-interview-v27-1" offline-interview/sw.js
          ! grep -q "whisper-local-boundary" offline-interview/app.js
          ! grep -q "boundedTranscriptionQueue" offline-interview/app.js
      - name: Commit recovery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js
          if git diff --cached --quiet; then
            echo 'No patch changes to commit'
          else
            git commit -m 'Recover V27 runtime from blocking boundary Whisper'
            git push origin HEAD:offline-interview-v27-1-runtime-recovery
          fi
# retrigger after structural patch fix
