name: Build V41.8 live-first candidate

on:
  push:
    branches:
      - offline-interview-v41-8-live-first

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-8-live-first
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply V41.8 patch
        run: python .github/v41_8_live_first.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js
      - name: Semantic boundary regression
        run: node offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Parse V41.8 questionnaire
        run: node -e "JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v41-8.json','utf8'))"
      - name: Commit exact candidate
        run: |
          rm .github/v41_8_live_first.py .github/workflows/v41-8-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build V41.8 live-first transcription candidate"
          git push
