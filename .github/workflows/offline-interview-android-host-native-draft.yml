name: Offline Interview Android Native Audio Authority

on:
  pull_request:
    paths:
      - 'offline-interview/beta-v41-23/**'
      - 'offline-interview/native/android-host-v1/**'
      - '.github/workflows/offline-interview-android-host-native-draft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native-audio-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Product V41.23 coherence
        run: node offline-interview/beta-v41-23/test-product-coherence.mjs

      - name: Product transcription port regression
        run: node offline-interview/beta-v41-23/test-transcription-engine-boundary.mjs

      - name: Android native audio authority contract
        run: node offline-interview/native/android-host-v1/test-host-contract.mjs

      - name: Build tactical Android host APK
        working-directory: offline-interview/native/android-host-v1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK and embedded V41.24 provenance
        run: |
          APK=offline-interview/native/android-host-v1/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/web/host-provenance.json'
          unzip -l "$APK" | grep -q 'assets/web/native-host-bridge.js'
          unzip -l "$APK" | grep -q 'assets/web/native-audio-capture.js'
          unzip -l "$APK" | grep -q 'assets/web/transcription-engine.js'
          sha256sum "$APK" | tee offline-interview/native/android-host-v1/app-debug.sha256

      - name: Upload tactical APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-interview-0.9.0-android-native-audio-authority1-tactical
          path: |
            offline-interview/native/android-host-v1/app/build/outputs/apk/debug/app-debug.apk
            offline-interview/native/android-host-v1/app-debug.sha256
          if-no-files-found: error
          retention-days: 14
