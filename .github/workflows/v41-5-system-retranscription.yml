name: Repair V41.5
on:
  push:
    branches: [offline-interview-v41-5-system-retranscription]
    paths:
      - '.github/workflows/v41-5-system-retranscription.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-5-system-retranscription
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python .github/v41_5_patch.py
      - run: python .github/v41_5_budget_patch.py
      - name: Validate V41.5
        run: |
          node --check offline-interview/app.js
          node --check offline-interview/system-stt.js
          node offline-interview/test-system-stt-boundary.mjs
          node offline-interview/test-system-stt-hard-cut.mjs
          node offline-interview/test-runtime-contract.mjs
          node -e "JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v41-5.json','utf8'))"
      - name: Commit repair
        run: |
          rm .github/workflows/v41-5-system-retranscription.yml .github/v41_5_patch.py .github/v41_5_budget_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair V41.5 system transcription and replay retranscription'
          git push origin HEAD:offline-interview-v41-5-system-retranscription
