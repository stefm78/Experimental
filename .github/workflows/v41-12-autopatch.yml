name: Build V41.12 bounded audio-track candidate

on:
  push:
    branches: [offline-interview-v41-11-direct-link]
    paths:
      - '.github/workflows/v41-12-autopatch.yml'

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-11-direct-link
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply V41.12 causal repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('offline-interview')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(root/'app.js',
              "const BUILD_ID = '2026-09-08.interview-runtime-v41.11';",
              "const BUILD_ID = '2026-09-08.interview-runtime-v41.12';")

          old_track = """  let started = false;\n  return {\n    track,\n    durationMs: Math.ceil(durationSeconds * 1000),\n    start() { if (!started) { started = true; source.start(0, startSeconds, durationSeconds); } },\n    cleanup() { try { if (started) source.stop(); } catch {} try { track.stop(); } catch {} context.close().catch(() => {}); }\n  };"""
          new_track = """  const trackDrainMs = 350;\n  let started = false;\n  let disposed = false;\n  let trackStopTimer = null;\n  let trackStopped = false;\n  const stopTrack = () => {\n    if (trackStopped) return;\n    trackStopped = true;\n    if (trackStopTimer) { clearTimeout(trackStopTimer); trackStopTimer = null; }\n    try { track.stop(); } catch {}\n  };\n  source.addEventListener('ended', () => {\n    if (disposed || trackStopped) return;\n    trackStopTimer = setTimeout(stopTrack, trackDrainMs);\n  }, { once: true });\n  return {\n    track,\n    durationMs: Math.ceil(durationSeconds * 1000),\n    drainMs: trackDrainMs,\n    start() { if (!started) { started = true; source.start(0, startSeconds, durationSeconds); } },\n    cleanup() {\n      disposed = true;\n      if (trackStopTimer) { clearTimeout(trackStopTimer); trackStopTimer = null; }\n      try { if (started) source.stop(); } catch {}\n      stopTrack();\n      context.close().catch(() => {});\n    }\n  };"""
          replace_once(root/'app.js', old_track, new_track)

          replace_once(root/'system-stt.js',
              "      stopTimer = setTimeout(() => { try { recognition.stop(); } catch { finish(); } }, Math.max(800, Number(durationMs) || 0) + 700);",
              "      // The supplied track contains only the requested excerpt. Stop recognition close to\n      // that bound instead of leaving a long-lived silent track that Chromium may keep consuming.\n      stopTimer = setTimeout(() => { try { recognition.stop(); } catch { finish(); } }, Math.max(900, (Number(durationMs) || 0) + 450));")

          replace_once(root/'index.html', 'styles.css?v=41.11', 'styles.css?v=41.12')
          replace_once(root/'index.html', 'app.js?v=41.11', 'app.js?v=41.12')

          sw = (root/'sw.js').read_text()
          if '41.11' not in sw:
              raise SystemExit('sw.js: V41.11 cache anchor missing')
          (root/'sw.js').write_text(sw.replace('41.11', '41.12'))

          runtime_contract = root/'test-runtime-contract.mjs'
          runtime_text = runtime_contract.read_text()
          if 'interview-runtime-v41\\.11' not in runtime_text:
              raise SystemExit('runtime contract V41.11 build anchor missing')
          runtime_contract.write_text(runtime_text.replace('interview-runtime-v41\\.11', 'interview-runtime-v41\\.12'))

          css = (root/'styles.css').read_text()
          anchor = "@media(max-width:979px){\n  .interview-mode .shell{width:min(860px,100%)!important;padding:8px!important;min-height:0!important}\n  .interview-layout{display:block}\n  .question-sidebar{display:none!important}"
          if css.count(anchor) != 1:
              raise SystemExit(f'styles.css: 979px anchor count={css.count(anchor)}')
          replacement = anchor + "\n  .mobile-only-metrics,.question-progress-mobile{display:none!important}"
          (root/'styles.css').write_text(css.replace(anchor, replacement, 1))

          kit = (root/'INTERVIEW_AUTHORING_KIT.md').read_text()
          prod = 'https://stefm78.github.io/Experimental/'
          beta = 'https://stefm78.github.io/Experimental/beta/'
          if prod not in kit:
              raise SystemExit('Authoring kit production URL anchor missing')
          (root/'INTERVIEW_AUTHORING_KIT_BETA.md').write_text(kit.replace(prod, beta))

          regression = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const app=fs.readFileSync(new URL('./app.js',import.meta.url),'utf8');
          const stt=fs.readFileSync(new URL('./system-stt.js',import.meta.url),'utf8');
          const css=fs.readFileSync(new URL('./styles.css',import.meta.url),'utf8');
          assert.match(app,/const BUILD_ID = '2026-09-08\.interview-runtime-v41\.12';/);
          assert.match(app,/const trackDrainMs = 350;/);
          assert.match(app,/source\.addEventListener\('ended',[\s\S]*setTimeout\(stopTrack, trackDrainMs\)/);
          assert.match(app,/cleanup\(\)[\s\S]*stopTrack\(\)[\s\S]*context\.close/);
          assert.match(stt,/Math\.max\(900, \(Number\(durationMs\) \|\| 0\) \+ 450\)/);
          assert.doesNotMatch(stt,/Math\.max\(800, Number\(durationMs\) \|\| 0\) \+ 700/);
          const replayBlock=app.slice(app.indexOf("const replay = document.createElement('button')"),app.indexOf("const retranscribe = document.createElement('button')"));
          assert.match(replayBlock,/const audioReady = Boolean\(turn\.audioRef\?\.recordingId\) && !isRecording\(\) && !captureFinalizing;/);
          assert.match(replayBlock,/replay\.disabled = !audioReady;/);
          assert.doesNotMatch(replayBlock,/systemRetranscription|stableRetranscription/);
          assert.match(css,/@media\(max-width:979px\)[\s\S]*\.question-sidebar\{display:none!important\}[\s\S]*\.mobile-only-metrics,\.question-progress-mobile\{display:none!important\}/);
          console.log('PASS V41.12 bounded-track + replay independence + intermediate UX');
          '''
          (root/'test-v41-12-field-repair.mjs').write_text(regression)

          pages = Path('.github/workflows/pages.yml')
          text = pages.read_text()
          anchor = "      - name: Runtime contract regression\n        run: node offline-interview/test-runtime-contract.mjs\n"
          if text.count(anchor) != 1:
              raise SystemExit('pages.yml runtime test anchor missing')
          text = text.replace(anchor, anchor + "      - name: V41.12 field repair regression\n        run: node offline-interview/test-v41-12-field-repair.mjs\n", 1)
          pages.write_text(text)
          PY
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Existing direct-link regression
        run: node offline-interview/test-direct-interview-link.mjs
      - name: Existing semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Existing hard handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Existing runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: V41.12 regression
        run: node offline-interview/test-v41-12-field-repair.mjs
      - name: Commit qualified candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview .github/workflows/pages.yml
          git commit -m 'Build V41.12 bounded audio-track field repair'
          git push origin HEAD:offline-interview-v41-11-direct-link
