          app = repl(app, "    recorder.start(500);", "    recorder.start();", 'single-container media recorder')

          # Remove dead decoder that duplicated the unsafe decode path.
          start = app.find("async function blobTo16kMono(blob) {")
          if start >= 0:
              end = app.find("async function handleRecordingStopped() {", start)
