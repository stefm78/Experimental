              app = app[:start] + app[end:]

          old_store = r'''  try {
    if (!chunks.length) return;
    const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
    const masterBlob = new Blob(masterAudioChunks, { type: recorder.mimeType || 'audio/webm' });
