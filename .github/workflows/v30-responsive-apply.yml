name: Apply Offline Interview V30 responsive shell

on:
  push:
    branches:
      - offline-interview-v30-responsive-shell
    paths:
      - offline-interview/v30-responsive-apply.py
      - .github/workflows/v30-responsive-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v30-responsive-shell
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V30 runtime patch
        run: python offline-interview/v30-responsive-apply.py
      - name: Validate JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Keep V29 capture regressions green
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V30 invariants
        run: |
          grep -q "2026-09-04.interview-runtime-v30" offline-interview/app.js
          grep -q 'mobileQuestionSelect' offline-interview/index.html
          grep -q 'mobileInterviewParticipants' offline-interview/index.html
          grep -q 'max-width:979px' offline-interview/styles.css
          grep -q 'position:sticky!important' offline-interview/styles.css
          grep -q 'app.js?v=30' offline-interview/index.html
          grep -q "offline-interview-v30" offline-interview/sw.js
      - name: Commit V30 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Apply responsive interview hierarchy without changing V29 capture'
            git push origin HEAD:offline-interview-v30-responsive-shell
          fi
