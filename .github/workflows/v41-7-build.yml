name: Build V41.7 boundary recovery candidate

on:
  push:
    branches:
      - offline-interview-v41-7-boundary-recovery
    paths:
      - '.github/workflows/v41-7-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-7-boundary-recovery
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply V41.7 patch
        run: python .github/v41_7_boundary_recovery.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Parse V41.7 questionnaire
        run: node -e "JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v41-7.json'))"
      - name: Commit exact candidate
        run: |
          rm .github/v41_7_boundary_recovery.py .github/workflows/v41-7-build.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build V41.7 boundary recovery candidate"
          git push origin HEAD:offline-interview-v41-7-boundary-recovery
