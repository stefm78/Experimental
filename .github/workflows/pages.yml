name: Validate and deploy Offline Interview POC

on:
  pull_request:
    paths:
      - 'offline-interview/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'offline-interview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/device-stt-capability.js && node --check offline-interview/stt-benchmark.js && node --check offline-interview/stt-deep-benchmark.js && node --check offline-interview/stt-lab-audio.js && node --check offline-interview/stt-lab-engines.js && node --check offline-interview/stt-lab-fixtures.js && node --check offline-interview/sw.js && node --check offline-interview/beta-v41-16/calibrated-field-layer-v41-16-1.js && node --check offline-interview/beta-v41-17/quality-controller.js && node --check offline-interview/beta-v41-17/sw.js && node --check offline-interview/beta-v41-18/quality-controller.js && node --check offline-interview/beta-v41-19/quality-controller.js && node --check offline-interview/experiments/concurrent-stt-v2/experiment.js && node --check offline-interview/experiments/stt-engine-lab-v1/lab.js && node --check offline-interview/experiments/quality-backend-handoff-v1/handoff.js && node --check offline-interview/experiments/simple-stt-lab/app.js && node --check offline-interview/experiments/simple-stt-lab/whisper-local.js
      - name: Semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract regression
        run: node offline-interview/test-runtime-contract.mjs
      - name: V41.16.1 shell regression
        run: node offline-interview/beta-v41-16/test-v41-16-shell.mjs
      - name: V41.17 quality-lane regression
        run: node offline-interview/beta-v41-17/test-quality-lanes.mjs
      - name: V41.18 adaptive concurrency regression
        run: node offline-interview/beta-v41-18/test-adaptive-concurrency.mjs
      - name: V41.19 calm quality regression
        run: node offline-interview/beta-v41-19/test-calm-quality.mjs
      - name: STT engine lab contract
        run: node offline-interview/experiments/stt-engine-lab-v1/test-lab-contract.mjs
      - name: QUALITY backend handoff contract
        run: node offline-interview/experiments/quality-backend-handoff-v1/test-contract.mjs
      - name: Simple STT Lab contract
        run: node offline-interview/experiments/simple-stt-lab/test-contract.mjs
      - name: Parse JSON assets
        run: node -e "JSON.parse(require('fs').readFileSync('offline-interview/interview.json')); JSON.parse(require('fs').readFileSync('offline-interview/interview-spec.schema.json')); JSON.parse(require('fs').readFileSync('offline-interview/manifest.webmanifest')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v29.json')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v39.json')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v40.json')); JSON.parse(require('fs').readFileSync('offline-interview/beta-v41-17/interview.json'))"
      - name: Verify required files
        run: test -f offline-interview/index.html && test -f offline-interview/INTERVIEW_AUTHORING_KIT.md && test -f offline-interview/interview-spec.schema.json && test -f offline-interview/device-stt-capability.html && test -f offline-interview/stt-benchmark.html && test -f offline-interview/stt-deep-benchmark.html && test -f offline-interview/styles.css && test -f offline-interview/icon.svg && test -f offline-interview/test-runtime-contract.mjs && test -f offline-interview/beta-v41-16/index.html && test -f offline-interview/beta-v41-16/calibrated-field-layer-v41-16-1.js && test -f offline-interview/beta-v41-17/index.html && test -f offline-interview/beta-v41-17/quality-controller.js && test -f offline-interview/beta-v41-17/QUALITY_TRANSCRIPTION_ARCHITECTURE.md && test -f offline-interview/beta-v41-18/index.html && test -f offline-interview/beta-v41-18/quality-controller.js && test -f offline-interview/beta-v41-18/test-adaptive-concurrency.mjs && test -f offline-interview/beta-v41-19/index.html && test -f offline-interview/beta-v41-19/quality-controller.js && test -f offline-interview/beta-v41-19/test-calm-quality.mjs && test -f offline-interview/beta-v41-19/PRODUCT_SIMPLIFICATION_AUDIT.md && test -f offline-interview/experiments/concurrent-stt-v2/experiment.js && test -f offline-interview/experiments/stt-engine-lab-v1/index.html && test -f offline-interview/experiments/stt-engine-lab-v1/lab.js && test -f offline-interview/experiments/stt-engine-lab-v1/README.md && test -f offline-interview/experiments/quality-backend-handoff-v1/index.html && test -f offline-interview/experiments/quality-backend-handoff-v1/handoff.js && test -f offline-interview/experiments/quality-backend-handoff-v1/README.md && test -f offline-interview/experiments/quality-backend-handoff-v1/test-contract.mjs && test -f offline-interview/experiments/simple-stt-lab/index.html && test -f offline-interview/experiments/simple-stt-lab/app.js && test -f offline-interview/experiments/simple-stt-lab/whisper-local.js && test -f offline-interview/experiments/simple-stt-lab/README.md && test -f offline-interview/experiments/simple-stt-lab/test-contract.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: offline-interview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
