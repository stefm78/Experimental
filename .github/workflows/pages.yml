name: Validate and deploy Offline Interview POC

on:
  pull_request:
    paths:
      - 'offline-interview/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'offline-interview/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/device-stt-capability.js && node --check offline-interview/stt-benchmark.js && node --check offline-interview/stt-deep-benchmark.js && node --check offline-interview/stt-lab-audio.js && node --check offline-interview/stt-lab-engines.js && node --check offline-interview/stt-lab-fixtures.js && node --check offline-interview/sw.js
      - name: Semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract regression
        run: node offline-interview/test-runtime-contract.mjs
      - name: Parse JSON assets
        run: node -e "JSON.parse(require('fs').readFileSync('offline-interview/interview.json')); JSON.parse(require('fs').readFileSync('offline-interview/interview-spec.schema.json')); JSON.parse(require('fs').readFileSync('offline-interview/manifest.webmanifest')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v29.json')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v39.json')); JSON.parse(require('fs').readFileSync('offline-interview/test-interviews/interview-test-ux-v40.json'))"
      - name: Verify required files
        run: test -f offline-interview/index.html && test -f offline-interview/INTERVIEW_AUTHORING_KIT.md && test -f offline-interview/interview-spec.schema.json && test -f offline-interview/device-stt-capability.html && test -f offline-interview/stt-benchmark.html && test -f offline-interview/stt-deep-benchmark.html && test -f offline-interview/styles.css && test -f offline-interview/icon.svg && test -f offline-interview/test-runtime-contract.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: offline-interview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
