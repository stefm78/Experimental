name: Build V41.15 field integrity candidate

on:
  push:
    branches: [offline-interview-v41-11-direct-link]
    paths:
      - '.github/workflows/v41-15-field-integrity.yml'

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-11-direct-link
          fetch-depth: 5
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Recover and apply V41.15 patch
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, subprocess
          text = subprocess.check_output(['git','show','HEAD^^^^:.github/workflows/v41-15-field-integrity.yml'], text=True)
          marker = "          cat > /tmp/patch_v4115.py <<'PY'\n"
          if marker not in text or "\n          PY\n          python /tmp/patch_v4115.py" not in text:
              raise SystemExit('original embedded patch not found')
          body = text.split(marker, 1)[1].split("\n          PY\n          python /tmp/patch_v4115.py", 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          patch = '\n'.join(lines) + '\n'
          patch = patch.replace("app = repl(app, old_render, new_render, 'retry render')", "pass  # retry render patched separately")
          patch = patch.replace("idx = repl(idx, recovery_anchor, recovery_new, 'active diagnostic panel')", "pass  # active diagnostic patched separately")
          pathlib.Path('/tmp/patch_v4115.py').write_text(patch)
          PY
          python /tmp/patch_v4115.py
          python - <<'PY'
          from pathlib import Path
          app_p = Path('offline-interview/app.js')
          idx_p = Path('offline-interview/index.html')
          app = app_p.read_text()
          idx = idx_p.read_text()
          anchors = [
              ("stableRetranscription === 'failed' ? '×' :", "stableRetranscription === 'rejected' ? '!' : stableRetranscription === 'failed' ? '×' :"),
              ("retranscribe.disabled = !audioReady || stableRetranscription === 'succeeded';", "retranscribe.disabled = !audioReady;"),
              ("? 'Transcription de cet audio terminée'", "? 'Retranscrire cet audio'"),
              (": stableRetranscription === 'failed'\n        ? 'Aucun texte reconnu — réessayer'", ": stableRetranscription === 'rejected'\n        ? 'Transcription rejetée — réessayer'\n        : stableRetranscription === 'failed'\n          ? 'Aucun texte reconnu — réessayer'")
          ]
          for old, new in anchors:
              if old not in app:
                  raise SystemExit(f'missing robust retry anchor: {old[:60]}')
              app = app.replace(old, new, 1)
          recovery = '          <div id="audioRecoveryBar" class="capture-integrity-alert hidden" role="status"><span id="audioRecoveryStatus">Audio dégradé · la session reste disponible.</span> <button id="audioRecoveryBtn" class="ghost small" type="button">Réinitialiser l’audio</button></div>'
          diagnostic = recovery + '\n          <details id="interviewDiagnosticPanel" class="manual-entry interview-diagnostics">\n            <summary>Diagnostic</summary>\n            <div class="actions compact-actions"><span>Audio <strong id="interviewAudioHealth">HEALTHY</strong></span><button id="interviewSimulateAudioFaultBtn" class="ghost small" type="button">Simuler panne audio</button></div>\n          </details>'
          if recovery not in idx:
              raise SystemExit('missing active diagnostic insertion anchor')
          idx = idx.replace(recovery, diagnostic, 1)
          app_p.write_text(app)
          idx_p.write_text(idx)

          # V41.14 regression is an invariant test; relax only its version pin in workspace.
          old_test = Path('offline-interview/test-v41-14-audio-resilience.mjs')
          t = old_test.read_text()
          marker = r"interview-runtime-v41\.14"
          if marker not in t:
              raise SystemExit('V41.14 version pin not found')
          old_test.write_text(t.replace(marker, r"interview-runtime-v41\.15", 1))
          PY
      - name: Parse JavaScript
        run: |
          node --check offline-interview/app.js
          node --check offline-interview/whisper-quality.js
          node --check offline-interview/test-v41-15-field-integrity.mjs
      - name: Direct-link regression
        run: node offline-interview/test-direct-interview-link.mjs
      - name: Semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: V41.13 deterministic-window regression
        run: node offline-interview/test-v41-13-field-repair.mjs
      - name: V41.14 audio resilience regression
        run: node offline-interview/test-v41-14-audio-resilience.mjs
      - name: V41.15 field integrity regression
        run: node offline-interview/test-v41-15-field-integrity.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Commit qualified candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/sw.js offline-interview/whisper-quality.js offline-interview/test-v41-15-field-integrity.mjs offline-interview/test-runtime-contract.mjs
          git commit -m 'Build V41.15 field integrity retry and diagnostic candidate'
          git push origin HEAD:offline-interview-v41-11-direct-link
