name: Build V41.15 field integrity candidate

on:
  push:
    branches: [offline-interview-v41-11-direct-link]
    paths:
      - '.github/workflows/v41-15-field-integrity.yml'

permissions:
  contents: write

jobs:
  patch-and-qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-11-direct-link
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply V41.15 field integrity repair
        shell: bash
        run: |
          cat > /tmp/patch_v4115.py <<'PY'
          from pathlib import Path
          import re

          root = Path('offline-interview')
          app_p = root/'app.js'
          idx_p = root/'index.html'
          sw_p = root/'sw.js'
          rt_p = root/'test-runtime-contract.mjs'
          app = app_p.read_text()
          idx = idx_p.read_text()
          sw = sw_p.read_text()
          rt = rt_p.read_text()

          def repl(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old, new, 1)

          # Runtime identity + bounded quality module.
          app = repl(app,
              "import { resolveDirectInterviewLink } from './direct-interview-link.js';",
              "import { resolveDirectInterviewLink } from './direct-interview-link.js';\nimport { assessWhisperTranscript } from './whisper-quality.js';",
              'quality import')
          app = repl(app, "2026-09-08.interview-runtime-v41.14", "2026-09-08.interview-runtime-v41.15", 'build id')

          # Active-interview diagnostic controls.
          app = repl(app,
              "audioRecoveryBtn: $('audioRecoveryBtn'), simulateAudioFaultBtn: $('simulateAudioFaultBtn'), prevBtn:",
              "audioRecoveryBtn: $('audioRecoveryBtn'), simulateAudioFaultBtn: $('simulateAudioFaultBtn'), interviewDiagnosticPanel: $('interviewDiagnosticPanel'), interviewSimulateAudioFaultBtn: $('interviewSimulateAudioFaultBtn'), interviewAudioHealth: $('interviewAudioHealth'), prevBtn:",
              'diagnostic ui refs')
          app = repl(app,
              "let recordingAudioOffsetMs = 0;\nlet audioContext = null;",
              "let recordingAudioOffsetMs = 0;\nlet recordingStopRequestedMs = 0;\nlet audioContext = null;",
              'timeline state')
          app = repl(app,
              "  if (ui.audioRecoveryBtn) ui.audioRecoveryBtn.disabled = next === 'RECOVERING';\n  if (changed && session)",
              "  if (ui.audioRecoveryBtn) ui.audioRecoveryBtn.disabled = next === 'RECOVERING';\n  if (ui.interviewAudioHealth) ui.interviewAudioHealth.textContent = next;\n  if (ui.interviewDiagnosticPanel && next === 'DEGRADED') ui.interviewDiagnosticPanel.open = true;\n  if (changed && session)",
              'health visible in interview')

          # Timeline observation: measure, do not invent a magic correction.
          app = repl(app,
              "    recordingCaptureId = uuid('capture');\n    recordingAudioOffsetMs = 0;",
              "    recordingCaptureId = uuid('capture');\n    recordingAudioOffsetMs = 0;\n    recordingStopRequestedMs = 0;",
              'recording timeline reset')
          app = repl(app,
              "  const durationSeconds = Math.max(0, (segmentEndMs - segmentStartMs) / 1000);\n  const cut = systemSpeechSession.takeSegment();",
              "  const durationSeconds = Math.max(0, (segmentEndMs - segmentStartMs) / 1000);\n  logRuntimeEvent('audio_boundary_observed', { recordingId, startMs: Math.round(segmentStartMs), endMs: Math.round(segmentEndMs), monotonicElapsedMs: Math.round(segmentEndMs) });\n  const cut = systemSpeechSession.takeSegment();",
              'boundary measurement')
          app = repl(app,
              "  const masterEndMs = recordingMasterStartedAt ? Math.max(recordingAudioOffsetMs, performance.now() - recordingMasterStartedAt) : recordingAudioOffsetMs + Math.max(0, performance.now() - startedRecordingAt);\n  composerDurationSeconds",
              "  const masterEndMs = recordingMasterStartedAt ? Math.max(recordingAudioOffsetMs, performance.now() - recordingMasterStartedAt) : recordingAudioOffsetMs + Math.max(0, performance.now() - startedRecordingAt);\n  recordingStopRequestedMs = masterEndMs;\n  composerDurationSeconds",
              'stop request measurement')
          app = repl(app,
              "        await validateStoredRecording(captureId);\n        audioValid = true;",
              "        const timeline = await validateStoredRecording(captureId);\n        audioValid = true;\n        const logicalStopMs = Math.round(recordingStopRequestedMs || 0);\n        logRuntimeEvent('audio_timeline_measured', { recordingId: captureId, logicalStopMs, decodedDurationMs: timeline.durationMs, tailMs: timeline.durationMs - logicalStopMs, ratio: logicalStopMs > 0 ? Number((timeline.durationMs / logicalStopMs).toFixed(6)) : null });",
              'timeline final measurement')

          # Manual Whisper becomes retryable and quality-gated.
          app = repl(app,
              "  const stable = turn.systemRetranscription;\n  if (stable?.audioKey === audioKey && stable.status === 'succeeded') { showError(ui.interviewError, 'Cette prise a déjà une retranscription stabilisée. Le texte reste modifiable manuellement.'); return; }\n  if (activeSystemRetranscriptions.has(audioKey)) return;",
              "  const previous = turn.systemRetranscription;\n  const attempt = (Number(previous?.attempt) || 0) + 1;\n  if (activeSystemRetranscriptions.has(audioKey)) return;",
              'remove immutable success gate')
          app = repl(app,
              "    logRuntimeEvent('manual_whisper_started', { turnId: turn.id, recordingId: ref.recordingId });",
              "    logRuntimeEvent('manual_whisper_started', { turnId: turn.id, recordingId: ref.recordingId, attempt });",
              'attempt provenance')
          old_success = """    const text = cleanText(result?.text || '');
    if (!text) throw new Error('Aucun texte reconnu dans cette fenêtre audio.');
    turn.text = text; turn.rawTranscript = text; turn.source = 'whisper-local-retranscribed';
    turn.systemRetranscription = { audioKey, status: 'succeeded', text, mode: 'whisper-local', at: nowIso() };
    turn.updatedAt = nowIso(); session.updatedAt = nowIso();
    logRuntimeEvent('manual_whisper_succeeded', { turnId: turn.id, recordingId: ref.recordingId, stable: true, reason });
    persistSessionLater('manual-whisper-retranscription');"""
          new_success = """    const text = cleanText(result?.text || '');
    if (!text) throw new Error('Aucun texte reconnu dans cette fenêtre audio.');
    const quality = assessWhisperTranscript(text);
    if (!quality.ok) {
      turn.systemRetranscription = { audioKey, status: 'rejected', text, reason: quality.reason, mode: 'whisper-local', at: nowIso(), attempt };
      turn.updatedAt = nowIso(); session.updatedAt = nowIso();
      logRuntimeEvent('manual_whisper_rejected', { turnId: turn.id, recordingId: ref.recordingId, attempt, qualityReason: quality.reason });
      showError(ui.interviewError, 'Retranscription rejetée : sortie répétitive ou manifestement dégénérée. Vous pouvez réessayer.');
      persistSessionLater('manual-whisper-rejected');
      return;
    }
    const humanProtected = Boolean(turn.humanEdited);
    if (!humanProtected) { turn.text = text; turn.source = 'whisper-local-retranscribed'; }
    turn.rawTranscript = text;
    turn.systemRetranscription = { audioKey, status: 'succeeded', text, mode: 'whisper-local', at: nowIso(), attempt, humanProtected };
    turn.updatedAt = nowIso(); session.updatedAt = nowIso();
    logRuntimeEvent('manual_whisper_succeeded', { turnId: turn.id, recordingId: ref.recordingId, stable: true, reason, attempt, humanProtected });
    if (humanProtected) showError(ui.interviewError, 'Nouvelle retranscription disponible ; votre correction manuelle a été conservée.');
    persistSessionLater('manual-whisper-retranscription');"""
          app = repl(app, old_success, new_success, 'quality-gated whisper success')
          app = repl(app,
              "turn.systemRetranscription = { audioKey, status: 'failed', error: String(error?.message || error), mode: 'whisper-local', at: nowIso() };",
              "turn.systemRetranscription = { audioKey, status: 'failed', error: String(error?.message || error), mode: 'whisper-local', at: nowIso(), attempt };",
              'failed attempt provenance')
          app = repl(app,
              "logRuntimeEvent('manual_whisper_failed', { turnId: turn.id, recordingId: ref.recordingId, code:",
              "logRuntimeEvent('manual_whisper_failed', { turnId: turn.id, recordingId: ref.recordingId, attempt, code:",
              'failed runtime attempt')

          # A human edit becomes protected from subsequent automated retries.
          app = repl(app,
              "    text.addEventListener('change', async () => {\n      turn.text = cleanText(text.value);\n      turn.updatedAt = nowIso();",
              "    text.addEventListener('change', async () => {\n      const nextText = cleanText(text.value);\n      if (nextText !== turn.text) { turn.humanEdited = true; turn.humanEditedAt = nowIso(); }\n      turn.text = nextText;\n      turn.updatedAt = nowIso();",
              'human edit protection')

          # Retry UI: success/rejection remain actionable, only audio readiness gates the button.
          old_render = """    const stableRetranscription = turn.systemRetranscription?.status;
    const transcriptionGlyph = stableRetranscription === 'succeeded' ? '✓' : stableRetranscription === 'failed' ? '×' : '<svg class=\"audio-to-text-svg\" viewBox=\"0 0 34 18\" aria-hidden=\"true\"><path d=\"M2 9h2m2-4v8m3-11v14m3-9v4\"/><path class=\"audio-to-text-arrow\" d=\"M16 9h6m-2-2 2 2-2 2\"/><path d=\"M25 5h7M25 9h7M25 13h5\"/></svg>';
    retranscribe.innerHTML = `<span class=\"audio-to-text-icon\" aria-hidden=\"true\">${transcriptionGlyph}</span>`;
    retranscribe.disabled = !audioReady || stableRetranscription === 'succeeded';
    retranscribe.title = stableRetranscription === 'succeeded'
      ? 'Transcription de cet audio terminée'
      : stableRetranscription === 'failed'
        ? 'Aucun texte reconnu — réessayer'
        : trackSupported
          ? 'Transcrire cet audio en texte'
          : 'Transcription depuis un audio enregistré non prise en charge sur ce navigateur';"""
          new_render = """    const stableRetranscription = turn.systemRetranscription?.status;
    const transcriptionGlyph = stableRetranscription === 'succeeded' ? '✓' : stableRetranscription === 'rejected' ? '!' : stableRetranscription === 'failed' ? '×' : '<svg class=\"audio-to-text-svg\" viewBox=\"0 0 34 18\" aria-hidden=\"true\"><path d=\"M2 9h2m2-4v8m3-11v14m3-9v4\"/><path class=\"audio-to-text-arrow\" d=\"M16 9h6m-2-2 2 2-2 2\"/><path d=\"M25 5h7M25 9h7M25 13h5\"/></svg>';
    retranscribe.innerHTML = `<span class=\"audio-to-text-icon\" aria-hidden=\"true\">${transcriptionGlyph}</span>`;
    retranscribe.disabled = !audioReady;
    retranscribe.title = stableRetranscription === 'succeeded'
      ? 'Retranscrire cet audio'
      : stableRetranscription === 'rejected'
        ? 'Transcription rejetée — réessayer'
        : stableRetranscription === 'failed'
          ? 'Aucun texte reconnu — réessayer'
          : trackSupported
            ? 'Transcrire cet audio en texte'
            : 'Transcription depuis un audio enregistré non prise en charge sur ce navigateur';"""
          app = repl(app, old_render, new_render, 'retry render')

          app = repl(app,
              "ui.simulateAudioFaultBtn?.addEventListener('click', simulateAudioFault);",
              "ui.simulateAudioFaultBtn?.addEventListener('click', simulateAudioFault);\nui.interviewSimulateAudioFaultBtn?.addEventListener('click', simulateAudioFault);",
              'active diagnostic listener')

          # Make diagnostic fault injection reachable from the active interview view.
          recovery_anchor = """          <div id=\"audioRecoveryBar\" class=\"capture-integrity-alert hidden\" role=\"status\"><span id=\"audioRecoveryStatus\">Audio dégradé · la session reste disponible.</span> <button id=\"audioRecoveryBtn\" class=\"ghost small\" type=\"button\">Réinitialiser l’audio</button></div>

          <div class=\"actions interview-nav-actions\">"""
          recovery_new = """          <div id=\"audioRecoveryBar\" class=\"capture-integrity-alert hidden\" role=\"status\"><span id=\"audioRecoveryStatus\">Audio dégradé · la session reste disponible.</span> <button id=\"audioRecoveryBtn\" class=\"ghost small\" type=\"button\">Réinitialiser l’audio</button></div>
          <details id=\"interviewDiagnosticPanel\" class=\"manual-entry interview-diagnostics\">
            <summary>Diagnostic</summary>
            <div class=\"actions compact-actions\"><span>Audio <strong id=\"interviewAudioHealth\">HEALTHY</strong></span><button id=\"interviewSimulateAudioFaultBtn\" class=\"ghost small\" type=\"button\">Simuler panne audio</button></div>
          </details>

          <div class=\"actions interview-nav-actions\">"""
          idx = repl(idx, recovery_anchor, recovery_new, 'active diagnostic panel')

          # Version the shell.
          idx = idx.replace('styles.css?v=41.14', 'styles.css?v=41.15').replace('app.js?v=41.14', 'app.js?v=41.15')
          sw = sw.replace("offline-interview-v41.14", "offline-interview-v41.15").replace('styles.css?v=41.14', 'styles.css?v=41.15').replace('app.js?v=41.14', 'app.js?v=41.15')
          sw = repl(sw, "'./', './index.html', './styles.css?v=41.15', './app.js?v=41.15', './system-stt.js', './audio-window.js',",
                    "'./', './index.html', './styles.css?v=41.15', './app.js?v=41.15', './system-stt.js', './audio-window.js', './whisper-quality.js',",
                    'quality module shell')

          # Quality gate module: deliberately conservative; obvious repetitions only.
          quality = r'''export function assessWhisperTranscript(value) {
  const text = String(value ?? '').trim();
  if (!text) return { ok: false, reason: 'empty' };
  const tokens = text.toLocaleLowerCase('fr').match(/\p{L}[\p{L}\p{M}'’-]*/gu) || [];
  if (tokens.length < 12) return { ok: true, reason: null };
  const counts = new Map();
  let maxRun = 1, run = 1;
  for (let i = 0; i < tokens.length; i++) {
    counts.set(tokens[i], (counts.get(tokens[i]) || 0) + 1);
    if (i) { run = tokens[i] === tokens[i - 1] ? run + 1 : 1; maxRun = Math.max(maxRun, run); }
  }
  const dominant = Math.max(...counts.values()) / tokens.length;
  const diversity = counts.size / tokens.length;
  if (maxRun >= 6) return { ok: false, reason: 'repeated-token-run' };
  if (tokens.length >= 20 && dominant >= 0.35) return { ok: false, reason: 'dominant-token' };
  if (tokens.length >= 30 && diversity < 0.18) return { ok: false, reason: 'low-lexical-diversity' };
  return { ok: true, reason: null };
}
'''

          test = r'''import assert from 'node:assert/strict';
import fs from 'node:fs';
import { assessWhisperTranscript } from './whisper-quality.js';
const here = new URL('./', import.meta.url);
const app = fs.readFileSync(new URL('app.js', here), 'utf8');
const index = fs.readFileSync(new URL('index.html', here), 'utf8');

assert.match(app, /interview-runtime-v41\.15/);
assert.match(index, /id="interviewDiagnosticPanel"/);
assert.match(index, /id="interviewSimulateAudioFaultBtn"/);
assert.match(app, /interviewSimulateAudioFaultBtn\?\.addEventListener\('click', simulateAudioFault\)/);
assert.match(app, /if \(ui\.interviewDiagnosticPanel && next === 'DEGRADED'\) ui\.interviewDiagnosticPanel\.open = true/);
assert.match(app, /audio_boundary_observed/);
assert.match(app, /audio_timeline_measured/);
assert.match(app, /decodedDurationMs: timeline\.durationMs/);
assert.match(app, /tailMs: timeline\.durationMs - logicalStopMs/);

const bad = `Tu es une ${'cation '.repeat(80)}`;
assert.equal(assessWhisperTranscript(bad).ok, false, 'pathological repeated Whisper output must be rejected');
assert.equal(assessWhisperTranscript('Ceci est un segment normal pour vérifier que la retranscription reste lisible et fidèle à une phrase française ordinaire.').ok, true);
assert.equal(assessWhisperTranscript('alpha rouge stop').ok, true, 'short normal utterances must not be rejected');

const whisperBody = app.match(/async function retranscribeTurnWithSystem[\s\S]*?\n\}/)?.[0] || '';
assert.match(whisperBody, /const attempt = \(Number\(previous\?\.attempt\) \|\| 0\) \+ 1/);
assert.doesNotMatch(whisperBody, /déjà une retranscription stabilisée/);
assert.match(whisperBody, /assessWhisperTranscript\(text\)/);
assert.match(whisperBody, /status: 'rejected'/);
assert.match(whisperBody, /manual_whisper_rejected/);
assert.match(whisperBody, /humanProtected = Boolean\(turn\.humanEdited\)/);
assert.match(app, /retranscribe\.disabled = !audioReady;/);
assert.match(app, /Retranscrire cet audio/);
assert.match(app, /turn\.humanEdited = true; turn\.humanEditedAt = nowIso\(\)/);

console.log(JSON.stringify({status:'PASS', contract:'offline-interview.v41.15-field-integrity'}));
'''

          # Runtime contract identity + bounded new invariants.
          rt = repl(rt, "const audioWindow = read('audio-window.js');", "const audioWindow = read('audio-window.js');\nconst whisperQuality = read('whisper-quality.js');", 'runtime reads quality')
          rt = repl(rt, r"assert.match(app, /interview-runtime-v41\.14/);", r"assert.match(app, /interview-runtime-v41\.15/);", 'runtime app identity')
          rt = repl(rt, r"assert.match(sw, /offline-interview-v41\.14/);", r"assert.match(sw, /offline-interview-v41\.15/);", 'runtime sw identity')
          rt = repl(rt, r"assert.match(index, /styles\.css\?v=41\.14/);", r"assert.match(index, /styles\.css\?v=41\.15/);", 'runtime css identity')
          rt = repl(rt, r"assert.match(index, /app\.js\?v=41\.14/);", r"assert.match(index, /app\.js\?v=41\.15/);", 'runtime js identity')
          rt = repl(rt,
              "// Explicit anti-growth budgets. Raising one requires a conscious code-review decision.\nconst coreBytes = bytes(app) + bytes(css) + bytes(systemStt) + bytes(index) + bytes(sw);",
              "// V41.15 field-integrity invariants: active diagnostic access, measured timeline, conservative Whisper quality gate + retry.\nassert.match(index, /id=\"interviewDiagnosticPanel\"/);\nassert.match(app, /audio_timeline_measured/);\nassert.match(app, /manual_whisper_rejected/);\nassert.match(app, /retranscribe\\.disabled = !audioReady/);\nassert.match(app, /turn\\.humanEdited = true/);\nassert.match(sw, /whisper-quality\\.js/);\n// Explicit anti-growth budgets. Raising one requires a conscious code-review decision.\nconst coreBytes = bytes(app) + bytes(css) + bytes(systemStt) + bytes(index) + bytes(sw) + bytes(whisperQuality);",
              'runtime field integrity assertions')
          rt = rt.replace("// V41.14 adds bounded validation/recovery because field evidence showed decode failures could poison the audio lifecycle.\nassert.ok(bytes(app) <= 119_000, `app.js V41.14 resilience budget exceeded: ${bytes(app)} bytes`);",
                          "// V41.15 adds only bounded field-integrity logic on top of V41.14 resilience.\nassert.ok(bytes(app) <= 121_000, `app.js V41.15 field-integrity budget exceeded: ${bytes(app)} bytes`);")
          rt = rt.replace("assert.ok(coreBytes <= 220_000, `core source V41.14 resilience budget exceeded: ${coreBytes} bytes`);",
                          "assert.ok(coreBytes <= 223_000, `core source V41.15 field-integrity budget exceeded: ${coreBytes} bytes`);")
          rt = repl(rt, "await import('./test-v41-14-audio-resilience.mjs');", "await import('./test-v41-14-audio-resilience.mjs');\nawait import('./test-v41-15-field-integrity.mjs');", 'runtime imports v4115')
          rt = rt.replace("offline-interview.runtime-contract.v41.14", "offline-interview.runtime-contract.v41.15")

          app_p.write_text(app)
          idx_p.write_text(idx)
          sw_p.write_text(sw)
          rt_p.write_text(rt)
          (root/'whisper-quality.js').write_text(quality)
          (root/'test-v41-15-field-integrity.mjs').write_text(test)
          PY
          python /tmp/patch_v4115.py
      - name: Parse JavaScript
        run: |
          node --check offline-interview/app.js
          node --check offline-interview/whisper-quality.js
          node --check offline-interview/test-v41-15-field-integrity.mjs
      - name: Direct-link regression
        run: node offline-interview/test-direct-interview-link.mjs
      - name: Semantic boundary regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
      - name: Hard STT handoff regression
        run: node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: V41.13 deterministic-window regression
        run: node offline-interview/test-v41-13-field-repair.mjs
      - name: V41.14 audio resilience regression
        run: node offline-interview/test-v41-14-audio-resilience.mjs
      - name: V41.15 field integrity regression
        run: node offline-interview/test-v41-15-field-integrity.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Commit qualified candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/sw.js offline-interview/whisper-quality.js offline-interview/test-v41-15-field-integrity.mjs offline-interview/test-runtime-contract.mjs
          git commit -m 'Build V41.15 field integrity retry and diagnostic candidate'
          git push origin HEAD:offline-interview-v41-11-direct-link
