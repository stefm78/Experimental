name: Apply V36 intermediate transcription gap guard

on:
  push:
    branches: [offline-interview-v36-integrity-undo]
    paths:
      - '.github/workflows/v36-intermediate-gap-apply.yml'
      - 'offline-interview/v36-intermediate-gap-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v36-integrity-undo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python offline-interview/v36-intermediate-gap-apply.py
      - run: node --check offline-interview/app.js
      - run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify guard
        run: grep -q "Aucun texte reconnu pour ce passage au changement de personne" offline-interview/app.js
      - name: Commit guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-interview/app.js
          git commit -m "Guard intermediate speaker cuts against silent transcript loss"
          git push origin HEAD:offline-interview-v36-integrity-undo
