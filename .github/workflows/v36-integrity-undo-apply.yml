name: Apply Offline Interview V36 integrity and undo

on:
  push:
    branches: [offline-interview-v36-integrity-undo]
    paths:
      - '.github/workflows/v36-integrity-undo-apply.yml'
      - 'offline-interview/v36-integrity-undo-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v36-integrity-undo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair one-shot patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('offline-interview/v36-integrity-undo-apply.py')
          s = p.read_text(encoding='utf-8')
          block = '''app = replace_once(app,\n    "  renderCaptureQuestionContext();\\n}",\n    "  renderCaptureQuestionContext();\\n  renderCaptureIntegrityAlert();\\n}",\n    'capture alert render')\n\n'''
          if block in s:
              s = s.replace(block, '', 1)
          old = '''app = replace_once(app,\n    "    remove.className = 'ghost small icon-button';\\n    remove.textContent = '×';",\n    "    remove.className = 'ghost small icon-button turn-delete-button';\\n    remove.textContent = '×';",\n    'delete button class')'''
          new = '''app = replace_once(app,\n    "    remove.className = 'ghost small icon-button';\\n    remove.textContent = '×';\\n    remove.title = 'Supprimer cette prise de parole';",\n    "    remove.className = 'ghost small icon-button turn-delete-button';\\n    remove.textContent = '×';\\n    remove.title = 'Supprimer cette prise de parole';",\n    'delete button class')'''
          if old not in s:
              raise SystemExit('delete repair anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply V36 patch
        run: python offline-interview/v36-integrity-undo-apply.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Preserve STT boundary regressions
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V36 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('offline-interview')
          app = (root/'app.js').read_text(encoding='utf-8')
          css = (root/'styles.css').read_text(encoding='utf-8')
          index = (root/'index.html').read_text(encoding='utf-8')
          sw = (root/'sw.js').read_text(encoding='utf-8')
          assert "2026-09-04.interview-runtime-v36" in app
          assert "captureGaps: []" in app
          assert "function registerCaptureGap" in app
          assert "function resolveCaptureGap" in app
          assert "Prise de parole supprimée" in app
          assert "question-space-empty" in app and "question-space-busy" in app
          assert "À REPRENDRE" in app
          assert "captureIntegrityAlert" in index
          assert "styles.css?v=36" in index and "app.js?v=36" in index
          assert "offline-interview-v36" in sw and "styles.css?v=36" in sw and "app.js?v=36" in sw
          spec = json.loads((root/'test-interviews'/'interview-test-ux-v36.json').read_text(encoding='utf-8'))
          assert len([q for s in spec['sections'] for q in s['questions']]) == 4
          print('V36 invariants PASS')
          PY
      - name: Commit V36 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-interview/app.js offline-interview/styles.css offline-interview/index.html offline-interview/sw.js offline-interview/test-interviews/interview-test-ux-v36.json
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "Add V36 integrity gate, undo delete, and adaptive question space"
            git push origin HEAD:offline-interview-v36-integrity-undo
          fi
