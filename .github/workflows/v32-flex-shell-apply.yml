name: Apply Offline Interview V32 flex shell

on:
  push:
    branches:
      - offline-interview-v32-flex-shell-hardening
    paths:
      - offline-interview/v32-flex-shell-apply.py
      - .github/workflows/v32-flex-shell-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v32-flex-shell-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V32 runtime patch
        run: python offline-interview/v32-flex-shell-apply.py
      - name: Validate JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Preserve capture regressions
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V32 structural invariants
        run: |
          grep -q "2026-09-04.interview-runtime-v32" offline-interview/app.js
          grep -q 'display:flex!important' offline-interview/styles.css
          grep -q 'flex:0 0 auto!important' offline-interview/styles.css
          grep -q 'question-sticky{display:contents!important}' offline-interview/styles.css
          grep -q 'capture-question-context:not(:has' offline-interview/styles.css
          grep -q 'app.js?v=32' offline-interview/index.html
          grep -q "offline-interview-v32" offline-interview/sw.js
      - name: Commit V32 runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js
          if git diff --cached --quiet; then
            echo 'No runtime changes to commit'
          else
            git commit -m 'Harden footer sizing and compact navigation'
            git push origin HEAD:offline-interview-v32-flex-shell-hardening
          fi
