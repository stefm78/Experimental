name: Apply Offline Interview V27.2 visible runtime

on:
  push:
    branches:
      - offline-interview-v27-2-visible-runtime
    paths:
      - offline-interview/v27-2-visible-runtime-apply.py
      - .github/workflows/v27-2-visible-runtime-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v27-2-visible-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python offline-interview/v27-2-visible-runtime-apply.py
      - name: Validate syntax
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Verify invariants
        run: |
          grep -q "2026-09-04.interview-runtime-v27-2" offline-interview/app.js
          grep -q 'id="runtimeVersion"' offline-interview/index.html
          grep -q 'app.js?v=27-2' offline-interview/index.html
          grep -q "offline-interview-v27-2" offline-interview/sw.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview/app.js offline-interview/index.html offline-interview/sw.js
          git commit -m 'Show runtime version in transcription and privacy panel'
          git push origin HEAD:offline-interview-v27-2-visible-runtime
