name: Repair V41.1 storage readiness

on:
  push:
    branches: [offline-interview-v41-1-storage-ready]
    paths:
      - 'offline-interview/_v41_1_storage_ready_patch.py'
      - '.github/workflows/v41-1-storage-ready.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: offline-interview-v41-1-storage-ready
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply V41.1 patch
        run: python offline-interview/_v41_1_storage_ready_patch.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Existing regressions
        run: node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs && node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Runtime contract
        run: node offline-interview/test-runtime-contract.mjs
      - name: Commit repair
        run: |
          rm offline-interview/_v41_1_storage_ready_patch.py .github/workflows/v41-1-storage-ready.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add offline-interview .github/workflows
          git commit -m 'Repair V41.1 IndexedDB readiness race'
          git push origin HEAD:offline-interview-v41-1-storage-ready
