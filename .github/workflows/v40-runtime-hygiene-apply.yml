name: Apply bounded V40 runtime hygiene

on:
  push:
    branches: [offline-interview-v40-runtime-hygiene]
    paths:
      - '.github/workflows/v40-runtime-hygiene-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v40-runtime-hygiene
          fetch-depth: 0
      - name: Apply bounded runtime cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('offline-interview')

          app_path = root / 'app.js'
          app = app_path.read_text(encoding='utf-8')
          replacements = [
              ("const BUILD_ID = '2026-09-05.interview-runtime-v39';", "const BUILD_ID = '2026-09-06.interview-runtime-v40';"),
              ("function show(el, visible = true) { if (el) el.classList.toggle('hidden', !visible); }", "function show(el, visible = true) {\n  if (!el) return;\n  el.hidden = !visible;\n  el.classList.toggle('hidden', !visible);\n}"),
              ("    const reg = await navigator.serviceWorker.register('./sw.js?v=36', { scope: './' });", "    const reg = await navigator.serviceWorker.register('./sw.js', { scope: './' });"),
              ("    ui.diagSw.textContent = reg.active ? 'actif · v36' : 'installé · v36';", "    ui.diagSw.textContent = reg.active ? 'actif' : 'installé';"),
          ]
          for old, new in replacements:
              if old not in app:
                  raise SystemExit(f'app.js anchor missing: {old[:70]}')
              app = app.replace(old, new, 1)

          duplicate = """  requestAnimationFrame(() => {\n    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });\n    try { ui.doneView?.focus({ preventScroll: true }); } catch {}\n  });\n  requestAnimationFrame(() => {\n    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });\n    try { ui.doneView?.focus({ preventScroll: true }); } catch {}\n  });"""
          single = """  requestAnimationFrame(() => {\n    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });\n    try { ui.doneView?.focus({ preventScroll: true }); } catch {}\n  });"""
          if duplicate not in app:
              raise SystemExit('duplicate done-view focus anchor missing')
          app = app.replace(duplicate, single, 1)
          app_path.write_text(app, encoding='utf-8')

          css_path = root / 'styles.css'
          css = css_path.read_text(encoding='utf-8')
          css, count = re.subn(r'(\.interview-layout\{[^{}]*?)display:block!important', r'\1display:block', css)
          if count < 1:
              raise SystemExit('no responsive interview-layout display override repaired')
          css_path.write_text(css, encoding='utf-8')
          print(f'removed {count} dangerous interview-layout display!important override(s)')

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          for old, new in [('./styles.css?v=39', './styles.css?v=40'), ('./app.js?v=39', './app.js?v=40')]:
              if old not in index:
                  raise SystemExit(f'index anchor missing: {old}')
              index = index.replace(old, new, 1)
          index_path.write_text(index, encoding='utf-8')

          sw_path = root / 'sw.js'
          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const VERSION = 'offline-interview-v39';", "const VERSION = 'offline-interview-v40';", 1)
          sw = sw.replace("'./', './index.html', './styles.css?v=39', './app.js?v=39', './system-stt.js',", "'./', './index.html', './styles.css?v=40', './app.js?v=40', './system-stt.js',", 1)
          old_tools = """  './INTERVIEW_AUTHORING_KIT.md', './interview-spec.schema.json',\n  './stt-benchmark.html', './stt-benchmark.js?v=9',\n  './stt-deep-benchmark.html', './stt-deep-benchmark.js?v=9',\n  './device-stt-capability.html', './device-stt-capability.js?v=3',\n  './stt-lab-audio.js?v=4', './stt-lab-engines.js?v=4', './stt-lab-fixtures.js?v=3'"""
          new_tools = """  './INTERVIEW_AUTHORING_KIT.md', './interview-spec.schema.json'"""
          if old_tools not in sw:
              raise SystemExit('service-worker shell tool block anchor missing')
          sw = sw.replace(old_tools, new_tools, 1)
          sw_path.write_text(sw, encoding='utf-8')
          PY
      - name: Basic parse
        run: |
          node --check offline-interview/app.js
          node --check offline-interview/sw.js
      - name: Commit runtime cleanup
        run: |
          git config user.name "Stef"
          git config user.email "104558808+stefm78@users.noreply.github.com"
          git add offline-interview/app.js offline-interview/styles.css offline-interview/index.html offline-interview/sw.js
          git commit -m "V40 consolidate runtime state and cache hygiene"
          git push origin HEAD:offline-interview-v40-runtime-hygiene
