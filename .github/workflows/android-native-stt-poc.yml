name: Build Android Native STT POC

on:
  pull_request:
    paths:
      - 'offline-interview/native/android-stt-poc-v1/**'
      - '.github/workflows/android-native-stt-poc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: offline-interview/native/android-stt-poc-v1
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        run: test -s offline-interview/native/android-stt-poc-v1/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-interview-android-native-stt-poc-v1-debug
          path: offline-interview/native/android-stt-poc-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
