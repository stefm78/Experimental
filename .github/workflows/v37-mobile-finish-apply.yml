name: Apply Offline Interview V37 mobile finish

on:
  push:
    branches: [offline-interview-v37-mobile-finish]
    paths:
      - 'offline-interview/v37-mobile-finish-apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: offline-interview-v37-mobile-finish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V37 patch
        run: python offline-interview/v37-mobile-finish-apply.py
      - name: Parse JavaScript
        run: node --check offline-interview/app.js && node --check offline-interview/system-stt.js && node --check offline-interview/sw.js
      - name: Preserve STT regressions
        run: |
          node --experimental-default-type=module offline-interview/test-system-stt-boundary.mjs
          node --experimental-default-type=module offline-interview/test-system-stt-hard-cut.mjs
      - name: Verify V37 invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('offline-interview')
          app = (root/'app.js').read_text(encoding='utf-8')
          index = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'styles.css').read_text(encoding='utf-8')
          sw = (root/'sw.js').read_text(encoding='utf-8')
          assert "2026-09-04.interview-runtime-v37" in app
          assert "mobileFinishBtn" in app
          assert "mobileFinishBtn?.addEventListener('click', completeInterview)" in app
          assert 'id="mobileFinishBtn"' in index
          assert 'Terminer' in index
          assert '.mobile-finish-button{display:none}' in css
          assert '@media(max-width:759px){.mobile-finish-button{display:inline-flex' in css
          assert 'styles.css?v=37' in index and 'app.js?v=37' in index
          assert "offline-interview-v37" in sw and 'styles.css?v=37' in sw and 'app.js?v=37' in sw
          spec = json.loads((root/'test-interviews'/'interview-test-ux-v37.json').read_text(encoding='utf-8'))
          assert len([q for s in spec['sections'] for q in s['questions']]) == 1
          print('V37 invariants PASS')
          PY
      - name: Commit V37 runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-interview/app.js offline-interview/index.html offline-interview/styles.css offline-interview/sw.js offline-interview/test-interviews/interview-test-ux-v37.json
          if git diff --cached --quiet; then
            echo "No runtime changes to commit"
          else
            git commit -m "Add always-visible mobile finish action"
            git push origin HEAD:offline-interview-v37-mobile-finish
          fi
