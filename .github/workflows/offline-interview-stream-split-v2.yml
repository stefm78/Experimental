name: Offline Interview Stream Split V2

on:
  pull_request:
    paths:
      - 'offline-interview/**'
      - '.github/workflows/offline-interview-stream-split-v2.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate corrected product/native boundary
        run: node offline-interview/test-stream-split-v2.mjs
      - name: Validate V41.23 product coherence
        run: node offline-interview/beta-v41-23/test-product-coherence.mjs
