<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Beta V41.23 : runtime produit autonome, audio authoritative, LIVE best-effort et surface de transcription cohérente.">
  <title>Offline Interview — Beta V41.23</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=41.23">
</head>
<body>
  <div id="bootStatus" style="padding:18px;font-family:system-ui,sans-serif">Chargement de V41.23…</div>
  <script type="module">
    const boot=document.getElementById('bootStatus');
    try {
      const response=await fetch('./shell.html',{cache:'no-store'});
      if(!response.ok) throw new Error(`shell ${response.status}`);
      const parsed=new DOMParser().parseFromString(await response.text(),'text/html');
      const shell=parsed.querySelector('main.shell');
      if(!shell) throw new Error('shell introuvable');
      boot.replaceWith(document.importNode(shell,true));
      await import('./speech-network-failfast.js?v=41.23');
      await import('./app.js?v=41.23');
    } catch(error) {
      boot.textContent=`V41.23 indisponible : ${error?.message||error}`;
    }
  </script>
</body>
</html>
