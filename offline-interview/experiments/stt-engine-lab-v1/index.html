<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline Interview — STT Engine Lab V1</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#172033}main{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d8dde8;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid #aeb7c7;background:#fff}button.primary{background:#172554;color:#fff}.meter{height:14px;background:#e7eaf0;border-radius:8px;overflow:hidden;flex:1;min-width:200px}.meter>i{display:block;height:100%;width:0;background:#248a54}.pill{padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.warn{background:#fff7ed}.ok{background:#ecfdf5}.bad{background:#fef2f2}table{width:100%;border-collapse:collapse}th,td{text-align:left;vertical-align:top;border-bottom:1px solid #e6e8ee;padding:8px;font-size:13px}textarea{width:100%;min-height:72px}pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:#0f172a;color:#dbeafe;padding:10px;border-radius:10px;font-size:12px}.muted{color:#677083;font-size:13px}.segment{border:1px solid #e3e6ec;border-radius:12px;padding:12px;margin:10px 0}
</style>
</head>
<body><main>
<h1>STT Engine Lab V1</h1><p class="muted">Prototype indépendant. Aucun questionnaire, aucun traitement automatique, aucun service worker. On qualifie capture, segmentation et moteurs STT séparément.</p>
<div class="card"><div class="row"><button id="start" class="primary">Démarrer capture</button><button id="boundary" disabled>Frontière A/B</button><button id="stop" disabled>Arrêter</button><span id="state" class="pill">idle</span></div><div class="row" style="margin-top:10px"><b>Micro</b><div class="meter"><i id="meterBar"></i></div><span id="level">0</span></div></div>
<div class="card"><h2>LIVE STT</h2><div class="row"><button id="liveStart">Démarrer LIVE</button><button id="liveStop" disabled>Arrêter LIVE</button><select id="liveMode"><option value="standard">standard</option><option value="local">local si disponible</option></select><span id="liveState" class="pill">idle</span></div><textarea id="liveText" placeholder="Texte LIVE"></textarea><div id="capabilities" class="muted"></div></div>
<div class="card"><h2>Segments</h2><div id="segments"></div></div>
<div class="card"><h2>Journal brut</h2><div class="row"><button id="exportLog">Exporter diagnostic JSON</button><button id="clearLog">Effacer journal</button></div><pre id="log"></pre></div>
<script type="module" src="./lab.js?v=1"></script>
</main></body></html>
