<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUALITY Backend Handoff Lab V1</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f6f7fb;color:#172033}main{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d8dde8;border-radius:14px;padding:16px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input,textarea{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid #aeb7c7;background:#fff}button.primary{background:#172554;color:#fff}textarea{width:100%;min-height:80px;box-sizing:border-box}.pill{padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.ok{background:#ecfdf5}.warn{background:#fff7ed}.bad{background:#fef2f2}.muted{color:#677083;font-size:13px}pre{white-space:pre-wrap;max-height:280px;overflow:auto;background:#0f172a;color:#dbeafe;padding:10px;border-radius:10px;font-size:12px}</style></head><body><main><h1>QUALITY Backend Handoff Lab V1</h1><p class="muted">Prototype isolé. Aucun fournisseur STT réel, aucun appel réseau, aucune intégration V41.x.</p><div class="card"><h2>1 · Audio canonique</h2><div class="row"><button id="record" class="primary">Enregistrer 8 s</button><button id="stop" disabled>Arrêter</button><span id="audioState" class="pill">idle</span></div><audio id="audio" controls></audio><div id="identity" class="muted"></div></div><div class="card"><h2>2 · Job QUALITY</h2><div class="row"><button id="createJob" disabled>Créer job</button><button id="startJob" disabled>Passer RUNNING</button><button id="bumpRevision" disabled>Incrémenter révision source</button><span id="jobState" class="pill">aucun job</span></div><p class="muted" id="jobMeta"></p></div><div class="card"><h2>3 · Texte</h2><label>Texte utilisateur / cible</label><textarea id="targetText" placeholder="Texte visible"></textarea><div class="row"><button id="markHuman">Marquer comme édition humaine</button><span id="humanState" class="pill">non édité</span></div><label>Résultat fournisseur simulé</label><textarea id="providerText" placeholder="Saisir ici le transcript retourné par un futur backend"></textarea><div class="row"><button id="completeJob" disabled>Terminer SUCCEEDED</button><button id="failJob" disabled>Terminer FAILED</button></div></div><div class="card"><h2>4 · Verdict d'applicabilité</h2><div id="verdict" class="pill">en attente</div><p id="explain" class="muted"></p></div><div class="card"><h2>Journal</h2><div class="row"><button id="exportLog">Exporter diagnostic JSON</button><button id="reset">Réinitialiser</button></div><pre id="log"></pre></div><script type="module" src="./handoff.js?v=1"></script></main></body></html>
