<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="description" content="Beta V41.18 : transcription live + qualité adaptative concurrente si prouvée.">
  <title>Offline Interview — Beta V41.18</title>
  <link rel="manifest" href="../beta/manifest.webmanifest">
  <link rel="icon" href="../beta/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../beta/styles.css?v=41.15">
  <style>
    #qualityLaneStatus{position:fixed;right:10px;bottom:10px;z-index:30;max-width:min(680px,calc(100vw - 20px));padding:7px 10px;border-radius:10px;background:rgba(15,23,42,.92);color:#fff;font:12px/1.35 system-ui,sans-serif;box-shadow:0 4px 18px rgba(0,0,0,.16)}
    #qualityLaneStatus[data-state="ok"]{background:rgba(20,83,45,.94)}
    #qualityLaneStatus[data-state="warn"]{background:rgba(146,64,14,.94)}
  </style>
</head>
<body>
  <div id="bootStatus" style="padding:18px;font-family:system-ui,sans-serif">Chargement de V41.18…</div>
  <div id="qualityLaneStatus" data-state="ok" role="status" aria-live="polite">V41.18 · détection de la policy de concurrence…</div>
  <script type="module">
    const boot=document.getElementById('bootStatus');
    try{
      const response=await fetch('../beta/index.html',{cache:'no-store'});
      if(!response.ok) throw new Error(`beta index ${response.status}`);
      const parsed=new DOMParser().parseFromString(await response.text(),'text/html');
      const shell=parsed.querySelector('main.shell');
      if(!shell) throw new Error('shell beta introuvable');
      boot.replaceWith(document.importNode(shell,true));
      for(const link of document.querySelectorAll('a[href^="./"]')) link.href='../beta/'+link.getAttribute('href').slice(2);
      await import('../beta/app.js?v=41.15');
      await import('./quality-controller.js?v=41.18');
    }catch(error){
      boot.textContent=`V41.18 indisponible : ${error?.message||error}`;
      document.getElementById('qualityLaneStatus').dataset.state='warn';
    }
  </script>
</body>
</html>
